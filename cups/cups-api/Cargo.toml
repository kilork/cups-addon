[package]
name = "cups-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
regex = "1"
rumqttc = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
