---
version: 1.9.1
slug: cups
name: CUPS Print Server
image: "ghcr.io/kilork/cups-addon"
description: CUPS print server for network printing
url: https://github.com/kilork/cups-addon
codenotary: alexander.korolev.germany@gmail.com
arch:
  - aarch64
  - amd64
hassio_api: true
services:
  - mqtt:want
host_network: true
map:
  - data:rw
  - share:rw
init: false
ports:
  631/tcp: 631
ports_description:
  631/tcp: CUPS web interface and printing port
options:
  admin_username: "admin"
  admin_password: "admin"
  printer_driver_deb: ""
  api_port: 8000
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  admin_username: str
  admin_password: password
  printer_driver_deb: str
  api_port: port
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
startup: services
usb: true
devices:
  - /dev/bus/usb
apparmor: false
