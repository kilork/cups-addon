---
version: 1.5.0
slug: cups
name: CUPS Print Server
image: "ghcr.io/kilork/cups-addon"
description: CUPS print server for network printing
url: https://github.com/kilork/cups-addon
codenotary: alexander.korolev.germany@gmail.com
arch:
  - aarch64
  - amd64
hassio_api: true
host_network: true
map:
  - data:rw
  - share:rw
init: false
ports:
  631/tcp: 631
ports_description:
  631/tcp: CUPS web interface and printing port
options:
  admin_username: "admin"
  admin_password: "admin"
  printer_driver_deb: ""
schema:
  admin_username: str
  admin_password: password
  printer_driver_deb: str
startup: services
usb: true
devices:
  - /dev/bus/usb
apparmor: false
privileged:
  - SYS_RAWIO
  - SYS_MODULE
